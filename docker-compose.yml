services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewx
      POSTGRES_PASSWORD: interviewx
      POSTGRES_DB: interviewx
    ports:
      - "5432:5432"
    volumes:
      - interviewx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewx -d interviewx"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Phase 1+ (optional local services — not required for auth/dashboard):
  # ollama:
  #   image: ollama/ollama:latest
  #   ports: ["11434:11434"]
  # livekit:
  #   image: livekit/livekit-server:latest
  #   ...

volumes:
  interviewx_pgdata:
