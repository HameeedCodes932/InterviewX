services:
  postgres:
    image: postgres:16-alpine
    container_name: interviewx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: interviewx
      POSTGRES_PASSWORD: interviewx
      POSTGRES_DB: interviewx
    ports:
      - "5432:5432"
    volumes:
      - interviewx_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U interviewx -d interviewx"]
      interval: 5s
      timeout: 5s
      retries: 10

  livekit:
    image: livekit/livekit-server:v1.8.4
    container_name: interviewx-livekit
    restart: unless-stopped
    command: --dev --bind 0.0.0.0 --node-ip=127.0.0.1
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    # Dev keys: API key=devkey secret=secret

  # Optional: run Ollama in Docker if not installed on the host.
  # ollama:
  #   image: ollama/ollama:latest
  #   container_name: interviewx-ollama
  #   ports:
  #     - "11434:11434"
  #   volumes:
  #     - interviewx_ollama:/root/.ollama

volumes:
  interviewx_pgdata:
  # interviewx_ollama:
